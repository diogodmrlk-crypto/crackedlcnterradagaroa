<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>painel aimbot</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HBO Max">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Syne+Mono&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Cormorant Garamond"', 'serif'],
            mono: ['"Syne Mono"', 'monospace'],
            ui: ['"Syne"', 'sans-serif'],
          },
          colors: {
            ink: '#0a0a0a',
            void: '#121212',
            brand: '#0070f3',
            bright: '#00aaff',
            dusk: '#e0e0e0',
          },
          keyframes: {
            'fade-up': {
              '0%': { opacity: '0', transform: 'translateY(18px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            'scale-in': {
              '0%': { opacity: '0', transform: 'scale(0.88)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            shake: {
              '0%,100%': { transform: 'translateX(0)' },
              '20%,60%': { transform: 'translateX(-7px)' },
              '40%,80%': { transform: 'translateX(7px)' },
            },
            shimmer: {
              '0%': { transform: 'translateX(-150%) skewX(-12deg)' },
              '100%': { transform: 'translateX(250%) skewX(-12deg)' },
            },
            drip: {
              '0%': { height: '0', opacity: '1' },
              '80%': { height: '28px', opacity: '1' },
              '100%': { height: '28px', opacity: '0' },
            },
            'float-orb': {
              '0%,100%': { transform: 'translateY(0px) scale(1)' },
              '50%': { transform: 'translateY(-24px) scale(1.04)' },
            },
          },
          animation: {
            'fade-up': 'fade-up 0.7s cubic-bezier(.16,1,.3,1) both',
            'scale-in': 'scale-in 0.6s cubic-bezier(.16,1,.3,1) both',
            shake: 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both',
            shimmer: 'shimmer 1.6s ease-in-out infinite',
            drip: 'drip 1.2s ease-in forwards',
            'float-orb': 'float-orb 9s ease-in-out infinite',
          },
        },
      },
    };
  </script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      background-color: #0a0a0a;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    /* ============================
       TELA DE AVISO
    ============================ */
    #discordIntro {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      z-index: 999999;
    }
    #discordIntro h1 {
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: clamp(25px, 8vw, 42px);
      font-weight: 800;
      letter-spacing: 2px;
      text-shadow:
        0 0 10px #fff,
        0 0 30px rgba(255,255,255,.5);
      animation: introAppear .7s ease;
    }
    #discordIntro p {
      margin-top: 12px;
      color: #aaa;
      font-family: Arial, sans-serif;
      font-size: 13px;
    }
    #discordBar {
      width: min(75%, 320px);
      height: 4px;
      margin-top: 25px;
      background: #222;
      border-radius: 20px;
      overflow: hidden;
    }
    #discordProgress {
      width: 0%;
      height: 100%;
      background: #fff;
      box-shadow: 0 0 15px #fff;
      animation: discordLoading 3s linear forwards;
    }
    @keyframes discordLoading {
      from {
        width: 0%;
      }
      to {
        width: 100%;
      }
    }
    @keyframes introAppear {
      from {
        opacity: 0;
        transform: scale(.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    /* Autofill */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus,
    input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 40px #0a0a0a inset !important;
      -webkit-text-fill-color: #e0e0e0 !important;
      transition: background-color 5000s ease-in-out 0s;
    }
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #003366;
      border-radius: 4px;
    }
    /* Grain */
    .grain::after {
      content: '';
      position: fixed;
      inset: -200%;
      width: 400%;
      height: 400%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      background-size: 256px 256px;
      opacity: 0.028;
      pointer-events: none;
      z-index: 999;
      animation: grain-drift 8s steps(10) infinite;
    }
    @keyframes grain-drift {
      0%,100% { transform: translate(0,0); }
      10% { transform: translate(-2%,-3%); }
      20% { transform: translate(3%,2%); }
      30% { transform: translate(-1%,4%); }
      40% { transform: translate(2%,-1%); }
      50% { transform: translate(-3%,2%); }
      60% { transform: translate(1%,-4%); }
      70% { transform: translate(-2%,3%); }
      80% { transform: translate(3%,-2%); }
      90% { transform: translate(-1%,1%); }
    }
    .vault-glass {
      background: linear-gradient(
        135deg,
        rgba(10,10,10,.72) 0%,
        rgba(5,5,5,.88) 100%
      );
      backdrop-filter: blur(48px) saturate(180%);
      -webkit-backdrop-filter: blur(48px) saturate(180%);
      border: 1.5px solid rgba(0,112,243,.4);
      box-shadow:
        0 30px 80px rgba(0,0,0,.85),
        0 0 40px rgba(0,112,243,.15),
        inset 0 1px 0 rgba(255,255,255,.05),
        inset 0 -1px 0 rgba(0,0,0,.5);
    }
    .vault-input {
      background: rgba(10,10,10,.6);
      border: 1px solid rgba(0,112,243,.2);
      color: #e0e0e0;
      transition: all .3s cubic-bezier(.16,1,.3,1);
      caret-color: #0070f3;
    }
    .vault-input::placeholder {
      color: rgba(0,112,243,.3);
    }
    .vault-input:focus {
      outline: none;
      background: rgba(15,15,15,.8);
      border-color: rgba(0,112,243,.5);
      box-shadow:
        0 0 0 3px rgba(0,112,243,.05),
        0 0 28px rgba(0,112,243,.05),
        inset 0 2px 10px rgba(0,0,0,.6);
    }
    .vault-btn {
      background: linear-gradient(
        135deg,
        rgba(0,112,243,.2) 0%,
        rgba(0,51,102,.4) 100%
      );
      border: 1px solid rgba(0,112,243,.3);
      transition: all .3s cubic-bezier(.16,1,.3,1);
      box-shadow:
        0 10px 30px rgba(0,0,0,.6),
        inset 0 1px 0 rgba(255,255,255,.05);
    }
    .vault-btn:hover {
      background: linear-gradient(
        135deg,
        rgba(0,112,243,.3) 0%,
        rgba(0,51,102,.5) 100%
      );
      border-color: rgba(0,112,243,.5);
      box-shadow:
        0 15px 40px rgba(0,0,0,.7),
        0 0 30px rgba(0,112,243,.2),
        inset 0 1px 0 rgba(255,255,255,.1);
      transform: translateY(-1px);
    }
    .vault-btn:active {
      transform: translateY(1px);
      box-shadow: 0 4px 12px rgba(0,0,0,.6);
    }
    .drip-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      pointer-events: none;
      overflow: visible;
    }
    .drip {
      position: absolute;
      top: -1px;
      width: 2px;
      background: linear-gradient(
        to bottom,
        rgba(0,112,243,.4),
        rgba(0,112,243,0)
      );
      border-radius: 0 0 50% 50%;
      transform-origin: top center;
    }
    .drip::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      background: rgba(0,112,243,.4);
      border-radius: 50%;
    }
    .divider-line {
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(0,112,243,.1) 40%,
        rgba(0,112,243,.3) 50%,
        rgba(0,112,243,.1) 60%,
        transparent 100%
      );
    }
    .status-success {
      color: #00aaff;
      text-shadow: 0 0 12px rgba(0,170,255,.5);
    }
    .status-error {
      color: #0070f3;
      text-shadow: 0 0 12px rgba(0,112,243,.5);
    }
    .delay-100 { animation-delay: 100ms; }
    .delay-200 { animation-delay: 200ms; }
    .delay-300 { animation-delay: 300ms; }
    .delay-400 { animation-delay: 400ms; }
    .delay-500 { animation-delay: 500ms; }
  </style>
</head>
<body class="grain relative min-h-screen flex items-center justify-center overflow-hidden font-ui">
  <!-- ==========================================
       AVISO DE 3 SEGUNDOS
       ========================================== -->
  <div id="discordIntro">
<h1>TERRA DA GAROA CRACKER</h1>
<p>
  Redirecionando para nosso Discord...
</p>
<div id="discordBar">
  <div id="discordProgress"></div>
</div>
  </div>
  <!-- AMBIENT ORBS -->
  <div class="fixed inset-0 pointer-events-none z-0" aria-hidden="true">
<div class="absolute top-[-15%] left-[-12%] w-[560px] h-[560px] rounded-full
            bg-blue-600/5 blur-[160px]
            animate-[float-orb_12s_ease-in-out_infinite]">
</div>
<div class="absolute bottom-[-12%] right-[-10%] w-[640px] h-[640px] rounded-full
            bg-blue-900/5 blur-[180px]
            animate-[float-orb_15s_ease-in-out_3s_infinite]">
</div>
<div class="absolute top-[40%] left-[55%] w-[300px] h-[300px] rounded-full
            bg-blue-500/5 blur-[100px]
            animate-[float-orb_10s_ease-in-out_6s_infinite]">
</div>
  </div>
  <!-- MAIN PANEL -->
  <main id="panel"
    class="vault-glass relative z-10 w-[92%] max-w-[400px]
           rounded-[2.5rem] px-8 py-10 md:px-10 md:py-12
           animate-scale-in">
<div class="drip-container" aria-hidden="true">
  <div class="drip animate-drip"
    style="left:18%;height:0;animation-delay:.2s;animation-fill-mode:both">
  </div>
  <div class="drip animate-drip"
    style="left:42%;height:0;animation-delay:.8s;width:3px;animation-fill-mode:both">
  </div>
  <div class="drip animate-drip"
    style="left:76%;height:0;animation-delay:1.4s;animation-fill-mode:both">
  </div>
</div>
<!-- HEADER -->
<div class="text-center mb-8 animate-fade-up delay-100">
  <h1 class="font-display text-3xl font-light tracking-[0.18em]
             text-bright/90 mb-1
             drop-shadow-[0_2px_12px_rgba(0,170,255,0.15)]">
    lcn.qzx
  </h1>
  <p class="font-mono text-[0.6rem] tracking-[0.3em]
            text-brand/50 uppercase">
    painel aimbot acesso restrito
  </p>
</div>
<div class="divider-line mb-8 animate-fade-up delay-200"></div>
<!-- SENHA -->
<div class="flex flex-col gap-5 mb-7">
  <div class="animate-fade-up delay-300">
    <label for="password"
      class="block font-mono text-[0.6rem]
             tracking-[0.22em] text-brand/60
             uppercase mb-2 ml-1">
      ⌘ Senha
    </label>
    <div class="relative">
      <input
        type="password"
        id="password"

      <button

               hover:text-brand/80
               transition-colors duration-200">
        <svg
          id="eyeIcon"

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M2.458 12C3.732 7.943 7.523 5 12 5
               c4.478 0 8.268 2.943 9.542 7

      </button>

<!-- BOTÃO ENTRAR -->
<div class="animate-fade-up delay-400">
  <button
    id="enterBtn"
    class="vault-btn relative w-full overflow-hidden
           rounded-[1.25rem] py-[15px]
           font-ui font-semibold text-[0.9rem]
           tracking-[0.28em] uppercase
           text-dusk/90 cursor-pointer">
    <span
      class="absolute inset-0 -translate-x-full
             bg-gradient-to-r from-transparent
             via-blue-400/10 to-transparent
             animate-shimmer
             pointer-events-none">
    </span>
    <span class="relative z-10 flex items-center
                 justify-center gap-2">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-3.5 h-3.5 opacity-70"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2.5">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 15v2m-6 4h12a2 2 0 002-2v-6
             a2 2 0 00-2-2H6a2 2 0 00-2 2v6
             a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
      Entrar
    </span>

<!-- STATUS -->
<div
  id="statusMsg"
  class="mt-5 min-h-[22px]
         text-center font-ui font-medium
         text-[0.78rem] tracking-widest
         transition-all duration-400 opacity-0">
</div>
<!-- FOOTER -->
<div class="mt-7 animate-fade-up delay-500">
  <div class="divider-line mb-4"></div>
  <p
    class="font-mono text-[0.55rem]
           text-center tracking-[0.28em]
           text-brand/30 uppercase
           select-none pointer-events-none">
    ⛓ developed by yzingzz
  </p>
</div>
  </main>
  <script>
    /* ==========================================
       REDIRECIONAMENTO DISCORD SEM LOOP
       ========================================== */
    (function() {
      const INTRO_KEY = "terra_gar oa_discord";
      const intro =
        document.getElementById("discordIntro");
      /*
       * Primeira vez:
       * mostra aviso por 3 segundos
       * e manda para o Discord.
       */
      if (sessionStorage.getItem(INTRO_KEY) !== "sim") {
        sessionStorage.setItem(INTRO_KEY, "sim");
        setTimeout(function() {
          window.location.href =
            "https://discord.gg/W7yq8xCvsm";
        }, 3000);
      } else {
        /*
         * Ao voltar do Discord:
         * remove o aviso e deixa o painel normal.
         */
        intro.style.display = "none";
      }
    })();
    /* ==========================================
       SISTEMA DO PAINEL
       ========================================== */
    (function() {
      const CORRECT_PASSWORD = 'TERRADAGAROA';
      const SUCCESS_URL = 'painel.html';
      const passwordInput =
        document.getElementById('password');
      const enterBtn =
        document.getElementById('enterBtn');
      const togglePassBtn =
        document.getElementById('togglePass');
      const eyeIcon =
        document.getElementById('eyeIcon');
      const statusMsg =
        document.getElementById('statusMsg');
      const panel =
        document.getElementById('panel');
      let isPasswordVisible = false;
      let attempts = 0;
      let isLocked = false;
      const eyeOpenPath = `
        <path stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 12a3 3 0 11-6 0
                 3 3 0 016 0z"/>
        <path stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.458 12C3.732 7.943
                 7.523 5 12 5
                 c4.478 0 8.268 2.943
                 9.542 7
                 -1.274 4.057-5.064 7
                 -9.542 7
                 -4.477 0-8.268-2.943
                 -9.542-7z"/>
      `;
      const eyeClosedPath = `
        <path stroke-linecap="round"
              stroke-linejoin="round"
              d="M13.875 18.825
                 A10.05 10.05 0 0112 19
                 c-4.478 0-8.268-2.943
                 -9.543-7
                 a9.97 9.97 0 011.563-3.029
                 m5.858.908
                 a3 3 0 114.243 4.243
                 M6.232 6.232l11.536 11.536"/>
      `;
      /* Mostrar / ocultar senha */
      togglePassBtn.addEventListener(
        'click',
        function(e) {
          e.preventDefault();
          isPasswordVisible =
            !isPasswordVisible;
          if (isPasswordVisible) {
            passwordInput.type = 'text';
            eyeIcon.innerHTML =
              eyeClosedPath;
          } else {
            passwordInput.type =
              'password';
            eyeIcon.innerHTML =
              eyeOpenPath;
          }
        }
      );
      /* Status */
      function showStatus(
        message,
        type = 'error'
      ) {
        statusMsg.textContent =
          message;
        statusMsg.className =
          'mt-5 min-h-[22px] text-center ' +
          'font-ui font-medium text-[0.78rem] ' +
          'tracking-widest transition-all duration-400';
        if (type === 'success') {
          statusMsg.classList.add(
            'status-success'
          );
        } else {
          statusMsg.classList.add(
            'status-error'
          );
        }
        statusMsg.style.opacity = '1';
        clearTimeout(
          statusMsg._timeout
        );
        statusMsg._timeout =
          setTimeout(function() {
            statusMsg.style.opacity = '0';
            statusMsg.textContent = '';
          }, 3000);
      }
      /* Shake */
      function shakePanel() {
        panel.classList.add(
          'animate-shake'
        );
        setTimeout(function() {
          panel.classList.remove(
            'animate-shake'
          );
        }, 400);
      }
      /* Login */
      function attemptLogin() {
        if (isLocked) {
          showStatus(
            '⛔ Bloqueado temporariamente. Aguarde...',
            'error'
          );
          return;
        }
        const enteredPassword =
          passwordInput.value.trim();
        if (!enteredPassword) {
          showStatus(
            '⚠️ Insira a senha para continuar',
            'error'
          );
          shakePanel();
          return;
        }
        if (
          enteredPassword ===
          CORRECT_PASSWORD
        ) {
          showStatus(
            '✅ Acesso concedido. Redirecionando...',
            'success'
          );
          enterBtn.disabled = true;
          enterBtn.style.opacity = '0.6';
          enterBtn.style.cursor =
            'not-allowed';
          setTimeout(function() {
            localStorage.setItem(
              'zsensi_key',
              enteredPassword
            );
            window.location.href =
              SUCCESS_URL;
          }, 1200);
          return;
        }
        attempts++;
        showStatus(
          `❌ Senha incorreta (${attempts}/3)`,
          'error'
        );
        shakePanel();
        passwordInput.value = '';
        passwordInput.focus();
        if (attempts >= 3) {
          isLocked = true;
          enterBtn.disabled = true;
          enterBtn.style.opacity = '0.5';
          enterBtn.style.cursor =
            'not-allowed';
          showStatus(
            '🔒 Bloqueado por 10 segundos...',
            'error'
          );
          setTimeout(function() {
            attempts = 0;
            isLocked = false;
            enterBtn.disabled = false;
            enterBtn.style.opacity = '1';
            enterBtn.style.cursor =
              'pointer';
            showStatus(
              '🔓 Você pode tentar novamente',
              'success'
            );
            passwordInput.focus();
          }, 10000);
        }
      }
      /* Eventos */
      enterBtn.addEventListener(
        'click',
        attemptLogin
      );
      passwordInput.addEventListener(
        'keydown',
        function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            attemptLogin();
          }
        }
      );
      passwordInput.focus();
    })();
  </script>
